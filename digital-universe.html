<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Universe · MrPrompt – Centrum Otwartych Innowacji</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230c0d10'/%3E%3Cpath d='M8 31V9l12 15L32 9v22' fill='none' stroke='%233d7bff' stroke-width='5' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="description" content="Digital Universe – osobista mapa wiedzy zbudowana z danych, które asystent AI (ChatGPT, Claude, Gemini i inne) ma o Tobie zapisane. Jeden plik, działa offline.">
<style>
:root{
  --bg:#0c0d10;--bg2:#13151a;--bg3:#1a1d24;
  --ink:#ece7dc;--ink2:#b9b4a8;--ink3:#8f8b80;
  --line:rgba(236,231,220,.14);--line2:rgba(236,231,220,.3);
  --acc:#e0a84a;--acc2:#6fb3ad;--danger:#e07a6a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 600px at 78% -10%,rgba(224,168,74,.07),transparent 70%),radial-gradient(800px 700px at -10% 110%,rgba(111,179,173,.06),transparent 70%)}
#dust{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--acc);color:#1a1405;padding:8px 12px;z-index:100}
.skip:focus{left:8px}

#app{position:relative;z-index:1;display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 20px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;background:rgba(12,13,16,.78);backdrop-filter:blur(6px)}
.brand{display:flex;gap:11px;align-items:center;text-decoration:none;color:var(--ink)}
.brand svg{width:40px;height:40px;flex:none}
.bt b{display:block;font:700 22px/1.1 var(--sans);letter-spacing:-.01em}
.bt i{display:block;font:normal 11.5px/1.3 var(--sans);color:var(--ink2);margin-top:3px}
.uni{margin:-6px 0 0;font:400 19px/1.25 var(--serif);overflow-wrap:anywhere}
.uni span{display:block;font:600 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
#nav{display:flex;flex-direction:column;gap:2px}
#nav a,.tool{display:flex;align-items:baseline;gap:10px;padding:8px 10px;border-radius:2px;text-decoration:none;color:var(--ink2);border:0;border-left:2px solid transparent;background:none;text-align:left;width:100%}
#nav a:hover,.tool:hover{color:var(--ink);background:rgba(236,231,220,.05)}
#nav a[aria-current=page]{color:var(--ink);border-left-color:var(--acc);background:rgba(224,168,74,.07)}
#nav .n{font:500 11px var(--mono);color:var(--ink3);min-width:22px}
#nav .c{margin-left:auto;font:11px var(--mono);color:var(--ink3)}
.srcai{margin:-8px 0 0;font:12px/1.4 var(--sans);color:var(--ink2);border-left:2px solid var(--acc2);padding-left:10px;overflow-wrap:anywhere}
.srcai span{display:block;font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.tools{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:14px}
.tool .k{margin-left:auto;font:11px var(--mono);color:var(--ink3);border:1px solid var(--line);padding:1px 6px}
.tool .bd{margin-left:auto;font:600 11px var(--mono);background:var(--acc);color:#1a1405;padding:1px 6px;border-radius:9px}

main{padding:clamp(22px,4.5vw,64px);max-width:1180px;width:100%;outline:none}
main.wide{max-width:none;padding-top:22px;padding-bottom:16px}
.vh{margin:0 0 clamp(24px,4vw,44px);max-width:70ch}
.vh .no{font:600 12px var(--mono);letter-spacing:.2em;color:var(--acc);text-transform:uppercase}
.vh h1{font:400 clamp(30px,4.6vw,54px)/1.08 var(--serif);margin:10px 0 14px;letter-spacing:-.01em}
.lead{color:var(--ink2);margin:0;max-width:62ch}
h2{font:400 24px/1.2 var(--serif);margin:0 0 6px}
h3.lb{font:600 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin:40px 0 12px;display:flex;align-items:center;gap:12px}
h3.lb::after{content:"";flex:1;height:1px;background:var(--line)}
h3.lb .ct{color:var(--acc)}
.empty{border:1px dashed var(--line2);padding:22px;color:var(--ink2);max-width:62ch}
.enter{animation:enter .42s cubic-bezier(.2,.7,.2,1) both}
.stg{animation:enter .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*38ms)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.chip{display:inline-flex;align-items:center;gap:6px;font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;padding:4px 7px;border:1px solid var(--c,var(--line2));color:var(--c,var(--ink2));white-space:nowrap}
.chip .g{width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip.ai{border-style:dashed}
.chip.warn{--c:var(--acc)}
.kt{display:inline-flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--c);letter-spacing:.04em}
.kt svg{width:10px;height:10px;fill:var(--c);flex:none}
.date{font:12px var(--mono);color:var(--ink3);white-space:nowrap}

.list{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:15px 8px}
.row:hover{background:rgba(236,231,220,.045)}
.r-t{display:block;font:400 19px/1.3 var(--serif)}
.r-s{display:block;color:var(--ink2);font-size:14.5px;margin-top:3px;max-width:68ch}
.r-m{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{display:inline-flex;align-items:center;gap:7px;background:none;border:1px solid var(--line2);padding:5px 10px;font-size:13.5px;color:var(--ink)}
.pill::before{content:"";width:7px;height:7px;background:var(--c,var(--ink3));border-radius:50%}
.pill:hover{border-color:var(--c,var(--acc));background:rgba(236,231,220,.05)}
.pill small{font:11px var(--mono);color:var(--ink3)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:none;padding:9px 16px;font-size:14px}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1a1405;font-weight:600}
.btn.pri:hover{background:#efbd66;color:#1a1405}
.btn.dng:hover{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:5px 11px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 20px}
.fl{background:none;border:1px solid var(--line);padding:5px 11px;font:12px var(--mono);color:var(--ink2)}
.fl[aria-pressed=true]{border-color:var(--acc);color:var(--ink);background:rgba(224,168,74,.1)}
input[type=text],input[type=search],textarea,select{background:var(--bg2);border:1px solid var(--line2);padding:10px 12px;width:100%;border-radius:0}
textarea{resize:vertical;min-height:120px;font:13px/1.45 var(--mono)}
label.f{display:block;font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:12px 0 5px}

/* identity */
.name{font:400 clamp(40px,7vw,88px)/1 var(--serif);margin:0 0 14px;letter-spacing:-.02em;overflow-wrap:anywhere}
.headline{font:italic 400 clamp(19px,2.4vw,26px)/1.35 var(--serif);color:var(--acc);margin:0 0 22px;max-width:46ch}
.prose{max-width:64ch;color:var(--ink2);font-size:17px}
.quote{border-left:2px solid var(--acc);margin:26px 0;padding:2px 0 2px 20px;max-width:56ch;font:italic 400 21px/1.45 var(--serif)}
.quote small{display:block;font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-style:normal;margin-bottom:6px}
.comp{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);margin-top:8px}
.comp div{padding:14px 20px;border-right:1px solid var(--line);min-width:110px}
.comp div:last-child{border-right:0}
.comp b{display:block;font:400 32px/1 var(--serif)}
.comp span{font:11px var(--mono);color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}

/* projects */
.proj{border-top:1px solid var(--line)}
.proj-h{display:grid;grid-template-columns:1fr auto;gap:8px 18px;width:100%;text-align:left;background:none;border:0;padding:18px 8px;align-items:start}
.proj-h:hover{background:rgba(236,231,220,.04)}
.proj-h .t{font:400 24px/1.25 var(--serif)}
.proj-h .m{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.proj-h .s{grid-column:1;color:var(--ink2);font-size:15px;max-width:66ch}
.caret{width:10px;height:10px;border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);transform:rotate(45deg);transition:transform .25s;margin:0 4px 3px}
.proj.open .caret{transform:rotate(-135deg) translate(-2px,-2px)}
.proj-p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.proj.open .proj-p{grid-template-rows:1fr}
.proj-p>div{overflow:hidden}
.proj-b{padding:4px 8px 26px 8px;max-width:76ch}
.proj-b p{margin:0 0 12px;color:var(--ink2)}
.cg{margin:14px 0 4px}
.cg h4{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}

/* skills */
.sk-q{max-width:420px;margin-bottom:6px}
.pill.big{font-size:15px;padding:7px 13px}
.hidden{display:none!important}

/* creative */
.idea{border-top:1px solid var(--line);padding:22px 8px 26px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;max-width:78ch}
.idea .t{font:400 28px/1.2 var(--serif)}
.idea p{margin:0;color:var(--ink2)}

/* timeline */
.tl{position:relative}
.yr{display:grid;grid-template-columns:110px minmax(0,1fr);gap:0 24px;margin-bottom:6px}
.yr>h3{margin:0;font:400 44px/1 var(--serif);color:transparent;-webkit-text-stroke:1px var(--line2);position:sticky;top:14px;align-self:start;padding-top:12px}
.yr>ol{list-style:none;margin:0;padding:0 0 18px 26px;border-left:1px solid var(--line2)}
.ev{position:relative}
.ev::before{content:"";position:absolute;left:-31px;top:21px;width:9px;height:9px;background:var(--c);border-radius:50%;box-shadow:0 0 0 4px var(--bg)}
.ev .row{border-top:0;padding:12px 8px}
.ev .row:hover{background:rgba(236,231,220,.045)}
.ev .kt{margin-top:4px}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.reveal.in{opacity:1;transform:none}

/* values */
.val{font:400 clamp(22px,3vw,32px)/1.25 var(--serif);border-top:1px solid var(--line);padding:20px 8px;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;display:block}
.val:hover{background:rgba(236,231,220,.04)}
.val small{display:block;font:15px/1.5 var(--sans);color:var(--ink2);margin-top:6px;max-width:64ch}

/* map */
.vh.compact{margin-bottom:14px;max-width:none}
.vh.compact h1{font-size:clamp(26px,3vw,36px);margin:6px 0 0}
.mapbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.mapbar .sp{flex:1}
.mapwrap{position:relative;height:calc(100vh - 215px);min-height:430px;border:1px solid var(--line);background:rgba(8,9,11,.55)}
.mapwrap:fullscreen{height:100vh;background:var(--bg)}
#mapcv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#mapcv:focus-visible{outline-offset:-3px}
.maphint{font:12px var(--mono);color:var(--ink3);margin:10px 0 0}

/* review */
.stats{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);margin-bottom:22px}
.stats div{padding:12px 18px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font:400 28px/1 var(--serif)}
.stats span{font:11px var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.rv{border-top:1px solid var(--line);padding:16px 8px;display:grid;gap:6px}
.rv.rej{opacity:.5}
.rv .top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.rv .t{font:400 19px/1.3 var(--serif)}
.rv p{margin:0;color:var(--ink2);font-size:14.5px;max-width:74ch}
.rv .meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font:12px var(--mono);color:var(--ink3)}
.rv form{background:var(--bg2);border:1px solid var(--line2);padding:6px 16px 16px;margin-top:8px;max-width:640px}
.note{border:1px solid var(--line2);padding:14px 18px;margin:0 0 22px;max-width:76ch;background:rgba(224,168,74,.06)}
.note ul{margin:8px 0 0;padding-left:20px;color:var(--ink2);font-size:14px}
.gaps{margin:0;padding-left:20px;color:var(--ink2);max-width:70ch}

/* start */
.steps{list-style:none;counter-reset:s;margin:0;padding:0;max-width:760px}
.steps>li{counter-increment:s;position:relative;padding:0 0 34px 56px;border-left:1px solid var(--line);margin-left:16px}
.steps>li::before{content:counter(s);position:absolute;left:-17px;top:-2px;width:34px;height:34px;border:1px solid var(--acc);background:var(--bg);color:var(--acc);font:600 14px/32px var(--mono);text-align:center;border-radius:50%}
.steps>li:last-child{border-left-color:transparent}
.steps p{color:var(--ink2);margin:6px 0 12px}
details.pr summary{cursor:pointer;color:var(--ink2);font-size:14px;margin:10px 0}
details.pr textarea{min-height:220px}
.err{border:1px solid var(--danger);padding:12px 16px;color:#f2b3a9;margin:12px 0;white-space:pre-wrap}
.drop{outline:2px dashed var(--acc);outline-offset:-10px}

/* drawer */
#drawer{position:fixed;z-index:30;top:0;right:0;bottom:0;width:min(430px,100%);background:#101217;border-left:1px solid var(--line2);transform:translateX(102%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.7,.2,1),visibility 0s .32s;overflow:auto;padding:22px 24px 40px}
#drawer.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.7,.2,1)}
.dr-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.x{background:none;border:1px solid var(--line2);width:34px;height:34px;font-size:20px;line-height:1}
.x:hover{border-color:var(--acc);color:var(--acc)}
#drawer h2{font-size:30px;line-height:1.15;margin:0 0 12px;overflow-wrap:anywhere}
.dr-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
#drawer p{color:var(--ink2);margin:0 0 12px}
#drawer dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:14px}
#drawer dt{font:11px var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
#drawer dd{margin:0;color:var(--ink2)}
.rel{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 4px}
.rel:hover{background:rgba(236,231,220,.05)}
.rel .rl{font:12px var(--mono);color:var(--acc)}
.rel .rt{font:400 17px/1.3 var(--serif)}

/* marka i pomoc */
.foot{margin-top:64px;padding-top:18px;border-top:1px solid var(--line);font:12.5px/1.6 var(--sans);color:var(--ink3);max-width:72ch}
.foot b{color:var(--ink2)}
.how{margin:-16px 0 30px;max-width:66ch}
.how summary{cursor:pointer;font:12px var(--mono);color:var(--acc2);letter-spacing:.04em;padding:4px 0}
.how p{margin:8px 0 0;color:var(--ink2);font-size:15px;border-left:2px solid var(--acc2);padding-left:14px}
.tip{border-left:2px solid var(--acc2);padding:2px 0 2px 14px;color:var(--ink2);font-size:15px;margin:10px 0;max-width:62ch}
details.faq{border-top:1px solid var(--line)}
details.faq:last-of-type{border-bottom:1px solid var(--line)}
details.faq summary{cursor:pointer;font:400 21px/1.3 var(--serif);padding:16px 4px;list-style:none;display:flex;justify-content:space-between;gap:16px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";font:300 26px/1 var(--sans);color:var(--acc)}
details.faq[open] summary::after{content:"–"}
.faq-b{padding:0 4px 20px;max-width:70ch;color:var(--ink2)}
.faq-b p{margin:0 0 10px}
.faq-b ul,.faq-b ol{margin:0 0 10px;padding-left:22px}
.faq-b li{margin-bottom:5px}
.gl{display:grid;grid-template-columns:max-content 1fr;gap:9px 16px;align-items:center;margin:8px 0 12px}
.aibtn{display:inline-flex;gap:6px;flex-wrap:wrap}
/* okno dialogowe, niezapisane, przycisk Nowe */
.modal{position:fixed;inset:0;z-index:70;background:rgba(5,6,8,.8);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.md-box{max-width:540px;width:100%;max-height:92vh;overflow:auto;background:#101217;border:1px solid var(--line2);border-top:3px solid var(--acc);padding:26px 26px 20px}
.md-box h2{font-size:27px;margin:0 0 12px}
.md-box p{margin:0 0 10px;color:var(--ink2)}
.md-box p b{color:var(--ink)}
.md-box .btns{margin-bottom:0}
.unsaved{margin:0;padding:9px 11px;border:1px solid var(--acc);background:rgba(224,168,74,.08);font-size:12.5px;line-height:1.45;color:var(--ink)}
.unsaved .btn{margin-top:7px}
.tool.newbtn{border:1px solid var(--line2);border-left:2px solid var(--acc);margin-bottom:8px;color:var(--ink)}
.tool.newbtn:hover{border-color:var(--acc);color:var(--acc)}
.saved-ok{border:1px solid var(--line2);border-left:2px solid var(--acc2);padding:10px 14px;max-width:70ch;margin:0 0 14px;color:var(--ink2);font-size:14.5px}
/* search */
#search{position:fixed;inset:0;z-index:40;background:rgba(5,6,8,.72);display:none;padding:10vh 16px 16px;justify-content:center;align-items:flex-start}
#search.open{display:flex}
.sp-panel{width:min(680px,100%);max-height:78vh;overflow:auto;background:#101217;border:1px solid var(--line2)}
.sp-panel input{border:0;border-bottom:1px solid var(--line2);font-size:19px;padding:18px 20px;background:transparent}
.sp-panel .res{padding:6px 0}
.sr-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;width:100%;text-align:left;background:none;border:0;padding:10px 20px}
.sr-i:hover,.sr-i:focus-visible{background:rgba(224,168,74,.1)}
.sr-i .t{font:400 17px var(--serif)}
.sr-i .s{grid-column:1;font-size:13px;color:var(--ink3)}
.sp-empty{padding:22px;color:var(--ink3)}

/* present */
#pbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:35;display:none;gap:6px;background:rgba(16,18,23,.9);border:1px solid var(--line2);padding:6px}
body.present #pbar{display:flex}
body.present #side{display:none}
body.present #app{grid-template-columns:1fr}
body.present main{margin:0 auto;font-size:18px;padding-bottom:90px}
body.present main.wide .mapwrap{height:calc(100vh - 190px)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#15130e;padding:10px 18px;z-index:60;opacity:0;pointer-events:none;transition:.3s;font-size:14px;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}

.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
.rm .reveal{opacity:1;transform:none}

@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)}

<script id="du-prompt" type="text/plain">Chcę, żebyś zebrał w jednym pliku JSON to, co o mnie wiesz. Dane trafią do aplikacji „Digital Universe", która zbuduje z nich interaktywną mapę mojej tożsamości, doświadczenia, wiedzy i projektów.

NAJWAŻNIEJSZE ZASADY
1. Korzystaj wyłącznie z tego, co naprawdę o mnie wiesz: z zapisanej pamięci, z tej rozmowy i z wcześniejszych rozmów, do których masz dostęp. Jeśli możesz, przejrzyj całą swoją pamięć o mnie, zanim zaczniesz.
2. Niczego nie zgaduj i nie uzupełniaj luk. Lepiej zwrócić mało wpisów niż jeden wymyślony. Jeśli wiesz o mnie niewiele, krótki JSON jest poprawnym wynikiem.
3. Gdy nie jesteś pewien informacji, ustaw "certainty": "do_weryfikacji". Gdy to Twoja interpretacja, a nie coś, co mi powiedziałem lub zapisałem, ustaw "status": "wniosek".
4. Nie oceniaj poziomu moich umiejętności (żadnych procentów, gwiazdek, "ekspert", "zaawansowany"). Nie zawyżaj moich osiągnięć.
5. Relacje ("relations") dodawaj tylko tam, gdzie wynikają z tego, co wiesz (np. projekt używa danej technologii, kompetencja wynika z danego doświadczenia). Nie łącz rzeczy po to, żeby mapa wyglądała lepiej. Każde "from" i "to" musi być identyfikatorem istniejącego wpisu z "items".
6. Daty podawaj tylko wtedy, gdy je znasz: "RRRR", "RRRR-MM" lub "RRRR-MM-DD". Coś, co trwa nadal, oznacz w "end" jako "obecnie". Brak daty to null.
7. Nie zakładaj, że jestem programistą, przedsiębiorcą, artystą czy kimkolwiek konkretnym. Typy wpisów dobierz do tego, co faktycznie o mnie wiesz.
8. Pisz po polsku. Identyfikatory ("id") pisz małymi literami, bez polskich znaków i spacji, np. "moj-projekt-1".
9. W polu "gaps" wypisz krótko, czego o mnie nie wiesz, a co pomogłoby uzupełnić obraz (np. "brak informacji o wykształceniu").
10. Podpisz się: w polu "meta.generated_by" wpisz prawdziwą nazwę swojego modelu i, jeśli ją znasz, wersję (np. nazwa produktu i model). Nie podawaj nazwy innego modelu. Jeśli nie wiesz, wpisz "nieznany model". W "meta.memory_access" opisz jednym zdaniem, do czego miałeś dostęp (np. "zapisana pamięć użytkownika", "tylko ta rozmowa", "brak pamięci").
11. Odpowiedz WYŁĄCZNIE jednym blokiem kodu JSON. Bez wstępu, bez komentarza po bloku.

FORMAT (zachowaj dokładnie tę strukturę; poniżej tylko szkielet, nie treść)
{
  "schema": "digital-universe/1",
  "person": {
    "name": "jak mam się do mnie zwracać",
    "headline": "jedno zdanie: kim jestem i czym się zajmuję",
    "summary": "2-5 zdań, wyłącznie z tego, co wiesz",
    "self_definition": "jak sam siebie określam, tylko jeśli to wynika z moich słów; w przeciwnym razie pusty tekst"
  },
  "items": [
    {
      "id": "krotki-identyfikator",
      "kind": "project",
      "title": "nazwa",
      "summary": "1-3 zdania",
      "details": "opcjonalnie: dłuższy opis, historia, kontekst",
      "status": "projekt",
      "start": "2021-03",
      "end": "obecnie",
      "source": "skąd to wiesz: pamięć / rozmowa / wniosek",
      "certainty": "potwierdzone",
      "tags": ["slowo", "slowo"]
    }
  ],
  "relations": [
    { "from": "id-wpisu-a", "to": "id-wpisu-b", "label": "używa" }
  ],
  "gaps": ["czego o mnie nie wiesz"],
  "meta": {
    "generated_by": "nazwa i wersja Twojego modelu",
    "generated_at": "RRRR-MM-DD",
    "memory_access": "do czego miałeś dostęp przy tworzeniu tych danych"
  }
}

DOZWOLONE WARTOŚCI "kind" (typ wpisu)
fact (potwierdzony fakt o mnie), experience (doświadczenie, rola, działalność), achievement (zrealizowany rezultat), event (ważne wydarzenie lub przełom), project (konkretne przedsięwzięcie), organization (firma, instytucja, grupa), person (ważna dla mnie osoba), skill (umiejętność lub obszar wiedzy), technology (technologia, narzędzie), interest (zainteresowanie), idea (pomysł, autorska koncepcja, metoda), value (deklarowana wartość lub zasada), goal (cel, plan, kierunek).

DOZWOLONE WARTOŚCI "status"
fakt, doswiadczenie, kompetencja, osiagniecie, projekt, w_trakcie (aktualnie rozwijane), koncepcja, plan, zainteresowanie, wartosc, wniosek (Twoja interpretacja, zawsze wyraźnie oznaczona).

DOZWOLONE WARTOŚCI "certainty"
potwierdzone (powiedziałem to wprost lub jest zapisane w pamięci), prawdopodobne (wynika z kontekstu), do_weryfikacji (nie jesteś pewien).

Pola "id", "kind", "title" są wymagane. Pozostałe możesz pominąć, jeśli ich nie znasz.</script>

  try{var t=$('#du-data').textContent.trim();if(t&&t!=='null'){var e=JSON.parse(t);base=e.meta&&e.meta.saved_at||null}}catch(x){}
  return base;
}
function setUnsaved(v){S.unsaved=!!v;lsSet(LSUNS,v?'1':'0')}
function persist(){
  if(!S.data)return;
  lsSet(LSKEY,JSON.stringify({base:curBase(),data:S.data}));
  setUnsaved(true);
}
function saveSettings(){lsSet(LSSET,JSON.stringify(S.settings))}
function reduced(){return typeof S.settings.reduce==='boolean'?S.settings.reduce:(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)}
function applyRM(){document.documentElement.classList.toggle('rm',reduced())}

/* ───────── wczytywanie i walidacja ───────── */
function extractJSON(text){
  var t=String(text||'');
  var m=/<script id="du-data" type="application\/json">([\s\S]*?)<\/script>/.exec(t);
  if(m&&m[1].trim()!=='null')t=m[1];
  var fence=/```(?:json)?\s*([\s\S]*?)```/i.exec(t);
  if(fence)t=fence[1];
  var a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<a)throw new Error('Nie znalazłem w tekście danych JSON (brak nawiasów { }). Skopiuj całą odpowiedź asystenta AI, od początku do końca bloku kodu.');
  return t.slice(a,b+1);
}
function validDate(s){
  var m=/^(\d{4})(?:-(\d{2})(?:-(\d{2}))?)?$/.exec(s);
  if(!m)return false;if(m[2]&&(+m[2]<1||+m[2]>12))return false;if(m[3]&&(+m[3]<1||+m[3]>31))return false;return true;
}
function parseDate(v,isEnd,W,title,field){
  var s=str(v);if(!s||s==='null')return '';
  var k=norm(s);
  if(isEnd&&(k==='obecnie'||k==='present'||k==='now'||k==='teraz'||k==='do dzis'||k==='trwa'))return 'obecnie';
  if(validDate(s))return s;
  W.push('„'+title+'": pole "'+field+'" ma nieczytelną datę („'+s+'") – pominięto datę.');return '';
}
function normalize(raw){
  var W=[];
  if(!raw||typeof raw!=='object'||Array.isArray(raw))return {errors:['Dane muszą być obiektem JSON w formie { ... }.']};
  if(!Array.isArray(raw.items))return {errors:['Brakuje listy "items". Bez niej nie ma z czego zbudować uniwersum.']};
  var p=raw.person&&typeof raw.person==='object'?raw.person:{};
  var person={name:str(p.name),headline:str(p.headline),summary:str(p.summary),self_definition:str(p.self_definition)};
  var items=[],used=new Set(),idmap=new Map();
  raw.items.forEach(function(r,i){
    if(!r||typeof r!=='object'||Array.isArray(r)){W.push('Wpis nr '+(i+1)+' pominięto (to nie jest obiekt).');return}
    var title=str(r.title);
    if(!title){W.push('Wpis nr '+(i+1)+' pominięto (brak "title").');return}
    var kind=KIND_ALIAS[key(r.kind)];
    if(!kind){W.push('„'+title+'": nieznany typ „'+str(r.kind)+'" – ustawiono „Fakt".');kind='fact'}
    var status=STATUS_ALIAS[key(r.status)];
    if(!status){if(str(r.status))W.push('„'+title+'": nieznany status „'+str(r.status)+'" – ustawiono domyślny dla typu.');status=DEFAULT_STATUS[kind]}
    var orig=str(r.id),id=slug(orig||title),base=id,n=2;
    while(used.has(id)){id=base+'-'+n++}
    if(id!==slug(orig||title))W.push('„'+title+'": powtórzony identyfikator – zmieniono na „'+id+'".');
    used.add(id);
    if(orig&&!idmap.has(orig))idmap.set(orig,id);
    if(!idmap.has(slug(orig||title)))idmap.set(slug(orig||title),id);
    var cert=CERT_ALIAS[key(r.certainty)];
    if(!cert)cert=status==='wniosek'?'prawdopodobne':'do_weryfikacji';
    var tags=Array.isArray(r.tags)?r.tags.map(str).filter(Boolean).slice(0,14):[];
    items.push({id:id,kind:kind,title:title,summary:str(r.summary),details:str(r.details),status:status,
      start:parseDate(r.start,false,W,title,'start'),end:parseDate(r.end,true,W,title,'end'),
      source:str(r.source),certainty:cert,tags:tags,rejected:!!r.rejected});
  });
  if(!items.length)return {errors:['Lista "items" nie zawiera żadnego poprawnego wpisu.']};
  var rels=[],seen=new Set();
  (Array.isArray(raw.relations)?raw.relations:[]).forEach(function(r,i){
    var a=idmap.get(str(r&&r.from)),b=idmap.get(str(r&&r.to));
    if(!a||!b){W.push('Relację nr '+(i+1)+' pominięto: wskazuje wpis, którego nie ma ('+str(r&&r.from)+' → '+str(r&&r.to)+').');return}
    if(a===b)return;
    var lab=str(r.label),k=a+'>'+b+'>'+norm(lab);
    if(seen.has(k))return;seen.add(k);rels.push({from:a,to:b,label:lab});
  });
  var meta=raw.meta&&typeof raw.meta==='object'?raw.meta:{};
  return {data:{schema:'digital-universe/1',person:person,items:items,relations:rels,
    gaps:Array.isArray(raw.gaps)?raw.gaps.map(str).filter(Boolean):[],
    meta:{saved_at:str(meta.saved_at)||new Date().toISOString(),generated_by:str(meta.generated_by),generated_at:str(meta.generated_at),memory_access:str(meta.memory_access),declared_by:str(meta.declared_by)}},warnings:W};
}
function importText(text){
  var json;
  try{json=JSON.parse(extractJSON(text))}
  catch(e){
    var msg=e instanceof SyntaxError?'Błąd składni JSON: '+e.message+'\nOdpowiedź mogła się urwać w połowie. Napisz asystentowi „kontynuuj" albo poproś o ponowne wysłanie całego JSON, a potem wklej od nowa.':e.message;
    return {errors:[msg]};
  }
  return normalize(json);
}
function acceptData(res,note){
  S.data=res.data;
  if(S.userName)S.data.person.name=S.userName;else if(S.data.person.name){S.userName=S.data.person.name;S.settings.userName=S.userName;saveSettings()}
  if(S.llm&&(!S.data.meta.generated_by||norm(S.data.meta.generated_by)==='nieznany model'))S.data.meta.declared_by=S.llm;
  S.report={warnings:res.warnings||[],count:res.data.items.length,rels:res.data.relations.length,note:note||''};
  S.open=new Set();S.editing=null;S.pasteDraft='';
  persist();reindex();go('review');
}

/* ───────── indeksy ───────── */
function reindex(){
  var d=S.data;
  X.all=new Map(d?d.items.map(function(i){return [i.id,i]}):[]);
  X.items=d?d.items.filter(function(i){return !i.rejected}):[];
  X.by=new Map(X.items.map(function(i){return [i.id,i]}));
  X.rels=d?d.relations.filter(function(r){return X.by.has(r.from)&&X.by.has(r.to)}):[];
  X.adj=new Map();X.items.forEach(function(i){X.adj.set(i.id,[])});
  X.rels.forEach(function(r){X.adj.get(r.from).push({id:r.to,label:r.label,dir:'out'});X.adj.get(r.to).push({id:r.from,label:r.label,dir:'in'})});
}
var deg=function(id){var a=X.adj.get(id);return a?a.length:0};
var ofKinds=function(ks){return X.items.filter(function(i){return ks.indexOf(i.kind)>-1})};
function dnum(s){
  if(!s)return null;if(s==='obecnie')return 9999;
  var m=/^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/.exec(s);if(!m)return null;
  return +m[1]+((+m[2]||1)-1)/12+((+m[3]||1)-1)/372;
}
var MON=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
function dfmt(s){
  if(!s)return '';if(s==='obecnie')return 'obecnie';
  var m=/^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/.exec(s);if(!m)return s;
  if(m[3])return (+m[3])+' '+MON[m[2]-1]+' '+m[1];if(m[2])return MON[m[2]-1]+' '+m[1];return m[1];
}
function range(it){
  if(it.start&&it.end)return it.start===it.end?dfmt(it.start):dfmt(it.start)+' – '+dfmt(it.end);
  if(it.start)return 'od '+dfmt(it.start);
  if(it.end)return it.end==='obecnie'?'obecnie':'do '+dfmt(it.end);
  return '';
}
function byDate(a,b){
  var x=dnum(a.start||a.end),y=dnum(b.start||b.end);
  if(x==null&&y==null)return a.title.localeCompare(b.title,'pl');
  if(x==null)return 1;if(y==null)return -1;return x-y||a.title.localeCompare(b.title,'pl');
}

/* ───────── komponenty HTML ───────── */
function shapeSvg(shape){return '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="'+SHAPES[shape]+'"/></svg>'}
function kindTag(k){var K=KINDS[k];return '<span class="kt" style="--c:'+K.color+'">'+shapeSvg(K.shape)+esc(K.label)+'</span>'}
function stChip(it){var s=STATUSES[it.status];return '<span class="chip st'+(it.status==='wniosek'?' ai':'')+'" title="'+esc(STATUS_DESC[it.status]||'')+'" style="--c:'+s.color+'"><i class="g"></i>'+esc(s.label)+'</span>'}
function certChip(it){return it.certainty==='do_weryfikacji'?'<span class="chip warn" title="'+esc(CERT_DESC.do_weryfikacji)+'">Do sprawdzenia</span>':''}
function row(it,i){
  return '<button class="row stg" style="--i:'+(i||0)+'" data-open="'+esc(it.id)+'"><span><span class="r-t">'+esc(it.title)+'</span>'+(it.summary?'<span class="r-s">'+esc(clip(it.summary,170))+'</span>':'')+'</span><span class="r-m">'+(range(it)?'<span class="date">'+esc(range(it))+'</span>':'')+stChip(it)+certChip(it)+'</span></button>';
}
function pill(it,extra){return '<button class="pill'+(extra||'')+'" data-open="'+esc(it.id)+'" data-n="'+esc(norm(it.title))+'" style="--c:'+KINDS[it.kind].color+'">'+esc(it.title)+(deg(it.id)?'<small title="'+deg(it.id)+' powiązań">'+deg(it.id)+'</small>':'')+'</button>'}
function linkedGroups(id,skipKinds){
  var out={};(X.adj.get(id)||[]).forEach(function(c){var t=X.by.get(c.id);if(!t||(skipKinds&&skipKinds.indexOf(t.kind)>-1))return;(out[t.kind]=out[t.kind]||[]).push(t)});
  return KIND_ORDER.filter(function(k){return out[k]}).map(function(k){
    return '<div class="cg"><h4>'+esc(KINDS[k].label)+' ('+out[k].length+')</h4><div class="pills">'+out[k].map(function(t){return pill(t)}).join('')+'</div></div>';
  }).join('');
}
function empty(msg){return '<p class="empty">'+esc(msg||'Brak danych tego typu. Asystent AI nie przekazał informacji do tej sekcji, więc jej nie wypełniam.')+'</p>'}
function head(sec){return '<header class="vh"><span class="no">'+sec.no+' · '+esc(sec.q)+'</span><h1>'+esc(sec.title)+'</h1><p class="lead">'+esc(sec.lead)+'</p></header>'+howBox(sec)}
function howBox(sec){return sec.how?'<details class="how"><summary>Jak to czytać?</summary><p>'+esc(sec.how)+'</p></details>':''}
function footer(){return '<footer class="foot"><b>MrPrompt · Centrum Otwartych Innowacji</b><br>Open Knowledge · Free Tools · Edukacja · Inkluzja · Odpowiedzialne AI.<br>Digital Universe działa lokalnie w Twojej przeglądarce i niczego nie wysyła do internetu.</footer>'}
function secOf(id){return SECTIONS.filter(function(s){return s.id===id})[0]}
function groupTitle(t,n){return '<h3 class="lb">'+esc(t)+' <span class="ct">'+n+'</span></h3>'}

 {id:'memory',q:'Czym jest pamięć AI i gdzie ją sprawdzić?',a:'<p>Po włączeniu pamięci AI zapisuje szczegóły Waszych rozmów i wraca do nich w nowych. Po wielu rozmowach trudno się zorientować, co tam jest, a czasem nawet nie wiesz, że coś zapisano.</p><p><b>ChatGPT:</b> otwórz Ustawienia, wejdź w Personalizację i kliknij „Zarządzaj wspomnieniami”. Zobaczysz zapisane wspomnienia i możesz każde usunąć. Pamięć możesz też wyłączyć całkiem (trzy kropki, „Usuń i wyłącz pamięć”).</p><p><b>Ważne:</b> usunięcie czatu nie usuwa tego, co AI z niego zapisało. Trzeba usunąć samą pamięć. W planach płatnych AI może korzystać także z poprzednich czatów, których nie ma na liście wspomnień.</p><p><b>Inne AI</b> (Claude, Gemini, Grok, Copilot…): poszukaj w ustawieniach konta opcji „Pamięć” albo „Personalizacja”. Nazwy i miejsca się zmieniają.</p>'},

 {id:'trouble',q:'Coś nie działa. Co robić?',a:'<ul><li><b>Czerwony komunikat po wklejeniu:</b> przeczytaj go, zwykle mówi, co poprawić. Najczęściej skopiowano za mało albo za dużo.</li><li><b>Odpowiedź AI urwała się:</b> napisz do AI „kontynuuj”, potem skopiuj całość od początku do końca.</li><li><b>AI odpowiedziało zwykłym tekstem zamiast kodu:</b> wyślij polecenie jeszcze raz w nowym czacie.</li><li><b>Nie działa kopiowanie:</b> rozwiń „Pokaż treść polecenia”, zaznacz tekst i skopiuj Ctrl+C.</li><li><b>Po ponownym otwarciu aplikacja jest pusta:</b> prawdopodobnie otwarto inny plik albo inną przeglądarkę. Otwórz zapisany plik HTML.</li></ul>'},
 {id:'keys',q:'Skróty klawiszowe',a:'<div class="gl"><span class="chip">/</span><span>Szukaj w całej bazie</span><span class="chip">P</span><span>Pokaz na pełnym ekranie</span><span class="chip">Esc</span><span>Zamknij okno, pokaz lub podgląd</span><span class="chip">← →</span><span>Poprzedni/następny slajd w pokazie, kolejne punkty na mapie</span><span class="chip">Enter</span><span>Otwórz wybrany punkt na mapie</span></div>'},
 {id:'about',q:'O MrPrompt',a:'<p><b>MrPrompt – Centrum Otwartych Innowacji.</b> Otwarta wiedza, darmowe narzędzia, edukacja, inkluzja i odpowiedzialne AI. Digital Universe jest jednym z takich narzędzi.</p>'}
];

   '<h1 class="name enter">'+esc(p.name||'Twoje uniwersum')+'</h1>'+(p.headline?'<p class="headline">'+esc(p.headline)+'</p>':'')+

     '<div class="proj-p" id="'+pid+'"><div><div class="proj-b">'+(p.summary?'<p>'+esc(p.summary)+'</p>':'')+(p.details?'<p>'+esc(p.details)+'</p>':'')+
       (p.tags.length?'<div class="pills" style="margin-bottom:8px">'+p.tags.map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('')+'</div>':'')+
       (linkedGroups(p.id)||'<p class="date">Brak zapisanych powiązań tego projektu.</p>')+
       '<div class="btns"><button class="btn sm" data-open="'+esc(p.id)+'">Szczegóły</button><button class="btn sm" data-act="map-here" data-id="'+esc(p.id)+'">Pokaż na mapie</button></div></div></div></div></div>';

V.timeline=function(){
  var sec=secOf('timeline'),h=head(sec);
  var dated=X.items.filter(function(i){return dnum(i.start||(i.end!=='obecnie'?i.end:''))!=null}).sort(byDate);
  var undated=X.items.filter(function(i){return dated.indexOf(i)<0});
  if(!dated.length)return h+empty('Żaden wpis nie ma daty, więc nie ma z czego zbudować osi czasu.');
  var kinds=KIND_ORDER.filter(function(k){return dated.some(function(i){return i.kind===k})});
  if(kinds.length>1)h+='<div class="filters" role="group" aria-label="Typy na osi czasu">'+kinds.map(function(k){return '<button class="fl" data-act="tl-kind" data-v="'+k+'" aria-pressed="'+(!S.tlHidden.has(k))+'">'+esc(KINDS[k].label)+'</button>'}).join('')+'</div>';
  var vis=dated.filter(function(i){return !S.tlHidden.has(i.kind)});
  var years=[],map={};
  vis.forEach(function(i){var y=String(i.start||i.end).slice(0,4);if(!map[y]){map[y]=[];years.push(y)}map[y].push(i)});
  h+='<p class="maphint" style="margin:0 0 22px">Zakres: '+esc(years[0]||'–')+' – '+esc(years[years.length-1]||'–')+' · '+vis.length+' z '+dated.length+' wpisów z datą</p><div class="tl">';
  years.forEach(function(y){
    h+='<section class="yr reveal"><h3>'+esc(y)+'</h3><ol>'+map[y].map(function(i){
      return '<li class="ev" style="--c:'+KINDS[i.kind].color+'"><button class="row" data-open="'+esc(i.id)+'"><span><span class="date">'+esc(range(i))+'</span><span class="r-t" style="display:block">'+esc(i.title)+'</span>'+kindTag(i.kind)+'</span><span class="r-m">'+stChip(i)+'</span></button></li>';
    }).join('')+'</ol></section>';
  });
  h+='</div>';
  if(undated.length)h+=groupTitle('Bez daty',undated.length)+'<div class="pills">'+undated.map(function(i){return pill(i)}).join('')+'</div>';
  return h;
};

V.review=function(){
  var d=S.data,all=d.items,rej=all.filter(function(i){return i.rejected}).length;
  var attn=all.filter(function(i){return !i.rejected&&(i.certainty==='do_weryfikacji'||i.status==='wniosek')}).length;
  var h='<header class="vh"><span class="no">Sprawdź dane</span><h1>Sprawdź, czy to prawda</h1><p class="lead">Model AI ('+esc(aiName())+') mógł się pomylić. Odrzuć to, co nieprawdziwe, popraw to, co niedokładne. Odrzucone wpisy znikają z uniwersum, ale możesz je przywrócić.</p></header>';
  if(S.report){
    var r=S.report;
    h+='<div class="note"><b>Wczytano '+r.count+' wpisów i '+r.rels+' powiązań. Źródło: '+esc(aiLine())+'.</b>'+(r.warnings.length?' Przy wczytywaniu poprawiono lub pominięto '+r.warnings.length+' rzeczy:<ul>'+r.warnings.slice(0,12).map(function(w){return '<li>'+esc(w)+'</li>'}).join('')+(r.warnings.length>12?'<li>…i '+(r.warnings.length-12)+' więcej.</li>':'')+'</ul>':' Wszystko wyglądało poprawnie.')+
     '<p style="margin:12px 0 0;color:var(--ink2)"><b>Co dalej?</b> 1) Przejrzyj listę poniżej i odrzuć to, co nieprawda. 2) Kliknij „Pokaż uniwersum”. 3) Na końcu zapisz swoją kopię w zakładce „Zapisz i ustawienia”.</p><div class="btns"><button class="btn pri sm" data-go="identity">Pokaż uniwersum</button><button class="btn sm" data-act="dismiss-report">Ukryj</button></div></div>';
  }
  h+='<div class="stats"><div><b>'+all.length+'</b><span>Wpisów</span></div><div><b>'+(all.length-rej)+'</b><span>Aktywnych</span></div><div><b>'+attn+'</b><span>Do sprawdzenia</span></div><div><b>'+rej+'</b><span>Odrzuconych</span></div></div>';
  if(d.gaps.length)h+='<h3 class="lb">Czego model o Tobie nie wie</h3><ul class="gaps">'+d.gaps.map(function(g){return '<li>'+esc(g)+'</li>'}).join('')+'</ul>';
  var kinds=KIND_ORDER.filter(function(k){return all.some(function(i){return i.kind===k})});
  h+='<h3 class="lb">Wpisy</h3><div class="filters"><label class="sr" for="rvShow">Pokaż</label><select id="rvShow" style="width:auto"><option value="attention"'+(S.rvShow==='attention'?' selected':'')+'>Do sprawdzenia ('+attn+')</option><option value="all"'+(S.rvShow==='all'?' selected':'')+'>Wszystkie ('+all.length+')</option><option value="rejected"'+(S.rvShow==='rejected'?' selected':'')+'>Odrzucone ('+rej+')</option></select>'+
   '<label class="sr" for="rvKind">Typ</label><select id="rvKind" style="width:auto"><option value="all">Wszystkie typy</option>'+kinds.map(function(k){return '<option value="'+k+'"'+(S.rvKind===k?' selected':'')+'>'+esc(KINDS[k].label)+'</option>'}).join('')+'</select></div>';
  var list=all.filter(function(i){
    if(S.rvKind!=='all'&&i.kind!==S.rvKind)return false;
    if(S.rvShow==='rejected')return i.rejected;
    if(S.rvShow==='attention')return !i.rejected&&(i.certainty==='do_weryfikacji'||i.status==='wniosek');
    return true;
  });
  if(!list.length)return h+empty(S.rvShow==='attention'?'Nic nie czeka na sprawdzenie. Wszystkie wpisy są oznaczone jako potwierdzone lub prawdopodobne.':'Brak wpisów dla tego filtra.');
  h+='<div>'+list.map(function(i){
    var ed=S.editing===i.id;
    return '<article class="rv'+(i.rejected?' rej':'')+'"><div class="top"><span><span class="t">'+esc(i.title)+'</span> '+kindTag(i.kind)+'</span><span style="display:flex;gap:8px;flex-wrap:wrap">'+stChip(i)+'<span class="chip'+(i.certainty==='do_weryfikacji'?' warn':'')+'">'+esc(CERT[i.certainty])+'</span></span></div>'+
     (i.summary?'<p>'+esc(i.summary)+'</p>':'')+'<div class="meta">'+(range(i)?'<span>'+esc(range(i))+'</span>':'')+(i.source?'<span>źródło: '+esc(i.source)+'</span>':'')+'</div>'+
     '<div class="btns" style="margin:6px 0 0"><button class="btn sm" data-act="edit" data-id="'+esc(i.id)+'">'+(ed?'Zamknij edycję':'Edytuj')+'</button><button class="btn sm '+(i.rejected?'':'dng')+'" data-act="reject" data-id="'+esc(i.id)+'">'+(i.rejected?'Przywróć':'Odrzuć')+'</button></div>'+
     (ed?editForm(i):'')+'</article>';
  }).join('')+'</div>';
  return h;
};

var searchPrev=null;
function runSearch(q){
  var toks=norm(q).split(/\s+/).filter(Boolean);if(!toks.length)return [];
  var res=new Map();
  X.items.forEach(function(it){
    var hay=norm([it.title,it.summary,it.details,it.tags.join(' '),KINDS[it.kind].label,STATUSES[it.status].label,it.source].join(' '));
    var t=norm(it.title),sc=0;
    for(var i=0;i<toks.length;i++){var k=toks[i];if(hay.indexOf(k)<0){sc=-1;break}sc+=t.indexOf(k)===0?6:t.indexOf(k)>-1?4:1}
    if(sc>0)res.set(it.id,{it:it,sc:sc,why:''});
  });
  X.rels.forEach(function(r){
    var l=norm(r.label);if(!l)return;
    if(toks.every(function(t){return l.indexOf(t)>-1})){[r.from,r.to].forEach(function(id){var e=res.get(id);if(e){if(!e.why)e.why='powiązanie: '+r.label}else res.set(id,{it:X.by.get(id),sc:.5,why:'powiązanie: '+r.label})})}
  });
  return Array.from(res.values()).sort(function(a,b){return b.sc-a.sc}).slice(0,40);
}

/* ───────── tło: pył ───────── */
var D={cv:null,ctx:null,pts:[],w:0,h:0,raf:0};
function dustInit(){
  D.cv=$('#dust');D.ctx=D.cv.getContext('2d');dustSize();
  window.addEventListener('resize',function(){dustSize()});
  dustLoop();
}
function dustSize(){
  var dpr=Math.min(window.devicePixelRatio||1,2);D.w=innerWidth;D.h=innerHeight;D.cv.width=D.w*dpr;D.cv.height=D.h*dpr;D.ctx.setTransform(dpr,0,0,dpr,0,0);
  var n=Math.round(clamp(D.w*D.h/16000,30,110));D.pts=[];
  for(var i=0;i<n;i++)D.pts.push({x:Math.random()*D.w,y:Math.random()*D.h,r:.4+Math.random()*1.1,vx:(Math.random()-.5)*.09,vy:-.02-Math.random()*.06,a:.1+Math.random()*.35});
  dustDraw(false);
}
function dustDraw(move){
  var c=D.ctx;c.clearRect(0,0,D.w,D.h);c.fillStyle='#ece7dc';
  D.pts.forEach(function(p){if(move){p.x+=p.vx;p.y+=p.vy;if(p.y<-2)p.y=D.h+2;if(p.x<-2)p.x=D.w+2;if(p.x>D.w+2)p.x=-2}c.globalAlpha=p.a;c.beginPath();c.arc(p.x,p.y,p.r,0,6.283);c.fill()});
  c.globalAlpha=1;
}
function dustLoop(){
  cancelAnimationFrame(D.raf);
  if(reduced()||P.on&&false){dustDraw(false);return}
  dustDraw(true);D.raf=requestAnimationFrame(dustLoop);
}

/* ───────── mapa powiązań ───────── */
var M={cv:null,ctx:null,nodes:[],links:[],by:new Map(),cam:{x:0,y:0,k:1},target:null,alpha:1,sel:null,hover:null,hidden:new Set(),w:0,h:0,dpr:1,raf:0,ro:null,ptrs:new Map(),down:null,drag:null,pan:null,pinch:null,kb:-1,hubs:new Set(),order:[],paths:{}};
function mapInit(){
  var cv=$('#mapcv');if(!cv)return;
  M.cv=cv;M.ctx=cv.getContext('2d');
  Object.keys(SHAPES).forEach(function(k){M.paths[k]=new Path2D(SHAPES[k])});
  var old=M.by;M.by=new Map();M.nodes=[];
  var kinds=KIND_ORDER.filter(function(k){return X.items.some(function(i){return i.kind===k})});
  X.items.forEach(function(it){
    var o=old.get(it.id),ang=(kinds.indexOf(it.kind)/kinds.length)*6.283+(Math.random()-.5)*.9,rad=90+Math.random()*230;
    var n={id:it.id,it:it,kind:it.kind,x:o?o.x:Math.cos(ang)*rad,y:o?o.y:Math.sin(ang)*rad,vx:0,vy:0,deg:deg(it.id),fixed:false,vis:true};
    n.r=clamp(5+Math.sqrt(n.deg)*2.7,5,17);
    M.nodes.push(n);M.by.set(n.id,n);
  });
  M.links=X.rels.map(function(r){return {s:M.by.get(r.from),t:M.by.get(r.to),label:r.label}});
  M.order=M.nodes.slice().sort(function(a,b){return b.deg-a.deg||a.it.title.localeCompare(b.it.title,'pl')});
  M.hubs=new Set(M.order.filter(function(n){return n.deg>0}).slice(0,18).map(function(n){return n.id}));
  M.kb=-1;M.hover=null;
  if(M.sel&&!M.by.has(M.sel))M.sel=null;
  M.alpha=old.size?.25:1;
  var warm=old.size?30:(reduced()?420:170);
  for(var i=0;i<warm;i++)mapTick();
  if(reduced())M.alpha=0;
  mapSize();
  if(!old.size)mapFit(true);
  else {mapFit(true)}
  if(M.ro)M.ro.disconnect();
  M.ro=new ResizeObserver(function(){mapSize();mapDraw()});M.ro.observe($('#mapwrap'));
  mapBind(cv);
  mapVis();
  if(M.sel)mapCenter(M.sel,true);

var P={on:false,timer:0,seq:[],i:0,paused:false};
function presentStart(){
  if(!S.data)return;
  P.seq=SECTIONS.filter(function(s){return s.id!=='map'||X.items.length}).map(function(s){return {v:s.id}});
  var hubs=X.items.filter(function(i){return deg(i.id)>0}).sort(function(a,b){return deg(b.id)-deg(a.id)}).slice(0,5);
  hubs.forEach(function(h){P.seq.push({v:'map',node:h.id})});
  P.on=true;P.i=0;P.paused=false;document.body.classList.add('present');
  closeDrawer();
  try{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(function(){})}catch(e){}
  pbar();presentShow();presentTimer();
  toast('Tryb prezentacji: strzałki zmieniają slajd, spacja pauzuje, Esc kończy');
}
function presentShow(){
  var s=P.seq[P.i];if(!s)return;
  if(S.view!==s.v||S.drawerId)go(s.v);
  if(s.node){setTimeout(function(){if(P.on&&M.cv&&M.by.has(s.node)){M.sel=s.node;mapCenter(s.node);openDetail(s.node,true)}},reduced()?0:350)}
  else if(S.drawerId)closeDrawer();

}

}
function presentTimer(){clearInterval(P.timer);if(!P.paused)P.timer=setInterval(function(){presentStep(1)},10000)}

  if(!P.on)return;P.on=false;clearInterval(P.timer);document.body.classList.remove('present');
  if(document.fullscreenElement&&document.exitFullscreen)try{document.exitFullscreen()}catch(e){}
  closeDrawer();

document.addEventListener('click',function(e){

    var id=t.getAttribute('data-open');

    case 'load-paste':{var ta=$('#paste');S.pasteDraft=ta?ta.value:'';if(!S.pasteDraft.trim()){showLoadErr(['Pole jest puste. Wklej odpowiedź asystenta AI.']);break}

    case 'export-json':exportJSON();break;
    case 'export-html':exportHTML();break;
    case 'reset':case 'new-start':confirmNew();break;

    case 'help-open':S.helpOpen=v;go('help');setTimeout(function(){var f=$('#faq-'+v);if(f)f.scrollIntoView({block:'start'})},40);break;

  if(typing||e.ctrlKey&&e.key!=='k'||e.altKey||e.metaKey&&e.key!=='k')return;
  if((e.key==='/'||(e.key==='k'&&(e.ctrlKey||e.metaKey)))&&S.data){e.preventDefault();openSearch()}
  else if((e.key==='p'||e.key==='P')&&S.data&&e.target===document.body){presentStart()}
});
$('#search').addEventListener('mousedown',function(e){if(e.target.id==='search')closeSearch()});
document.addEventListener('fullscreenchange',function(){
  if(!document.fullscreenElement&&P.on)presentStop();
  setTimeout(function(){mapSize();mapDraw()},60);
});
window.addEventListener('hashchange',function(){
  if(S.ignoreHash){S.ignoreHash=false;return}
  var v=location.hash.replace(/^#\/?/,'');if(VIEW_IDS.indexOf(v)<0)v=S.data?'identity':'start';
  S.view=v;if(S.drawerId)closeDrawer();render();
  var m=$('#main');if(m)try{m.focus({preventScroll:true})}catch(x){}
});
/* przeciąganie plików na stronę */
['dragenter','dragover'].forEach(function(n){document.addEventListener(n,function(e){if(e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],'Files')>-1){e.preventDefault();document.body.classList.add('drop')}})});
document.addEventListener('dragleave',function(e){if(!e.relatedTarget)document.body.classList.remove('drop')});
document.addEventListener('drop',function(e){
  document.body.classList.remove('drop');
  var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;e.preventDefault();readFile(f);
});

/* ───────── start ───────── */
loadState();applyRM();
var h0=location.hash.replace(/^#\/?/,'');
S.view=VIEW_IDS.indexOf(h0)>-1?h0:(S.data?'identity':'start');
if(!S.data&&!FREE[S.view])S.view='start';
dustInit();
render();
if(window.matchMedia){try{matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',function(){if(typeof S.settings.reduce!=='boolean'){applyRM();dustLoop()}})}catch(e){}}
})();
</script>
